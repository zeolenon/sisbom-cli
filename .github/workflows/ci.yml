name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: |
          python -m venv /tmp/sisbom-smoke
          /tmp/sisbom-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sisbom-smoke/bin/python "$GITHUB_WORKSPACE/tools/smoke_cli.py"
